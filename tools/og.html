<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;overflow:hidden;font-family:Ubuntu,"Segoe UI",Helvetica,Arial,sans-serif;color:#eaf6ff;
    background:radial-gradient(130% 95% at 50% 8%,#013568 0%,#01203f 58%,#010f1f 100%)}
  .stars{position:absolute;inset:0;opacity:.6;background-image:
    radial-gradient(2px 2px at 12% 22%,#fff 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 78% 14%,#fff 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 34% 78%,#cfe6ff 50%,transparent 51%),
    radial-gradient(2.2px 2.2px at 62% 88%,#fff 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 88% 55%,#fff 50%,transparent 51%),
    radial-gradient(1.8px 1.8px at 22% 90%,#fff 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 52% 30%,#cfe6ff 50%,transparent 51%),
    radial-gradient(2px 2px at 6% 58%,#fff 50%,transparent 51%)}
  img,h1,p,.ticker{position:relative;z-index:1}
  img{width:640px;image-rendering:pixelated;filter:drop-shadow(0 10px 30px rgba(198,244,3,.25))}
  h1{font-size:92px;font-weight:800;letter-spacing:-3px;margin-top:6px}
  h1 span{background:linear-gradient(90deg,#fb0201,#fd9502,#fdfb05,#2cfa04,#0096fd,#6331fd);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .ticker{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:12px;color:#c6f403}
  p{font-size:28px;color:rgba(234,246,255,.62)}
</style>
<div class="stars"></div>
<img src="nyan-logo.png" alt="">
<h1>nyan<span>.</span>city</h1>
<div class="ticker">$NYAN</div>
<p>Ride the beat. Hold the line.</p>
